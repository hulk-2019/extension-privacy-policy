# 阿里云函数计算 FC 3.0（Web 函数 / 自定义运行时）
# 部署：npm run deploy:fc
# 需先安装 Serverless Devs：npm i -g @serverless-devs/s
# 并配置密钥：s config add
edition: 3.0.0
name: cloud-dock
access: default

vars:
  region: cn-hangzhou
  functionName: cloud-dock-web

resources:
  web:
    component: fc3
    actions:
      pre-deploy:
        - run: npm run build
          path: ./
        - run: npm run prepare:fc
          path: ./
    props:
      region: ${vars.region}
      functionName: ${vars.functionName}
      description: CloudDock 隐私政策与流式音乐播放器
      runtime: custom.debian10
      memorySize: 1024
      timeout: 300
      instanceConcurrency: 10
      internetAccess: true
      code: .next/standalone
      layers:
        - acs:fc:${vars.region}:official:layers/Nodejs20/versions/1
      environmentVariables:
        PATH: /opt/nodejs20/bin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        NODE_ENV: production
        PORT: "3000"
        HOSTNAME: 0.0.0.0
        AUDIO_OSS_URL: ${env('AUDIO_OSS_URL', '')}
        AUDIO_LRC_URL: ${env('AUDIO_LRC_URL', '')}
        AUDIO_ALLOWED_HOSTS: ${env('AUDIO_ALLOWED_HOSTS', '')}
        AUDIO_CONTENT_TYPE: ${env('AUDIO_CONTENT_TYPE', 'audio/mpeg')}
      customRuntimeConfig:
        command:
          - node
          - server.js
        port: 3000
      triggers:
        - triggerName: httpTrigger
          triggerType: http
          triggerConfig:
            authType: anonymous
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - HEAD
              - PATCH
              - OPTIONS
      customDomain:
        domainName: nano-banana.ai520.wiki
        protocol: HTTP
        route:
          path: /*
